<body>
  <div id="root"></div>
  <audio id="bg-music" src="/music/Audio%20from%20Pratham.mp3" loop style="display: none;"></audio>
  <script>
    window.addEventListener('load', () => {
      const audio = document.getElementById('bg-music');
      // Set volume lower so it's not a jump scare
      audio.volume = 0.5;

      const attemptPlay = () => {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            // Autoplay was blocked, wait for a valid user interaction to start
            const validGestures = ['click', 'keydown', 'touchstart', 'pointerdown'];

            const playOnInteraction = () => {
              const playPromise2 = audio.play();
              if (playPromise2 !== undefined) {
                playPromise2.then(() => {
                  // Successfully played, remove listeners
                  validGestures.forEach(evt =>
                    window.removeEventListener(evt, playOnInteraction)
                  );
                }).catch(err => {
                  // Still blocked, keep listening 
                });
              }
            };

            validGestures.forEach(evt =>
              window.addEventListener(evt, playOnInteraction)
            );
          });
        }
      };

      // Attempt to play after page has fully loaded
      attemptPlay();
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
